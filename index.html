// ---- ロジック（変更なし）
let current, correctIndex;

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function next(){
  const correct=words[Math.floor(Math.random()*words.length)];
  let options=[correct];
  while(options.length<4){
    let r=words[Math.floor(Math.random()*words.length)];
    if(!options.includes(r)) options.push(r);
  }
  options=shuffle(options);
  correctIndex=options.indexOf(correct);
  current=correct;

  document.getElementById("question").innerText=correct.en;

  let html="";
  options.forEach((o,i)=>{
    html+=`<div class="option" onclick="check(${i})">${o.zh}</div>`;
  });

  document.getElementById("options").innerHTML=html;
  document.getElementById("result").innerHTML="";
}

function check(i){
  let opts=document.getElementsByClassName("option");

  if(i===correctIndex) opts[i].classList.add("correct");
  else{
    opts[i].classList.add("wrong");
    opts[correctIndex].classList.add("correct");
  }

  document.getElementById("result").innerHTML=
  `<p>✅ ${current.zh}</p>
   <p class="jp">${current.jyut}</p>
   <p>${current.ex}</p>
   <p class="jp">${current.exjyut}</p>
   <p class="en">${current.exen}</p>
   <button onclick="speak()">🔊 音声</button>`;
}

function speak(){
  const u1=new SpeechSynthesisUtterance(current.zh);
  u1.lang="zh-HK";
  const u2=new SpeechSynthesisUtterance(current.ex);
  u2.lang="zh-HK";

  speechSynthesis.cancel();
  speechSynthesis.speak(u1);
  speechSynthesis.speak(u2);
}

next();
